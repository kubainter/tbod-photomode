; TBOD_PhotoMode v1.6.2 configuration
; Lines starting with ; are comments. Keys are case-insensitive.
; Key names match standard names (e.g. F8, F1, F3, F11, E, Q, R, P, H, Escape, etc.).
; Gamepad keys: Gamepad_DPad_Up/Down/Left/Right, Gamepad_Special_Right,
;   Gamepad_LeftThumbstick, Gamepad_RightThumbstick,
;   Gamepad_FaceButton_Bottom/Right/Left/Top,
;   Gamepad_LeftShoulder, Gamepad_RightShoulder
; (Note: Gamepad_Special_Left is reserved for the game's native GameHub/Map)
; Multiple key names can be separated by commas (all listed keys are bound).

[PhotoMode]
; Toggle key for Photo Mode (keyboard). On gamepad, use Triple-Tap L3 (Left Stick) or L3 + R3.
toggle_key = F8
exit_guard_key = Escape, Gamepad_Special_Right
pause_key = F2, Gamepad_FaceButton_Bottom
hud_key = H
screenshot_key = P, Gamepad_FaceButton_Right, Gamepad_RightThumbstick
fov_reset_key = F3, Gamepad_LeftThumbstick
osd_reset_key = R, Gamepad_FaceButton_Top
move_up_key = E
move_down_key = Q
osd_show_on_enter = 1
osd_toggle_key = F1, Gamepad_FaceButton_Left
osd_scale = 1.5
; Verbose diagnostics (socket/bone dumps, per-component mesh scans).
; Keep 0 for normal use — enable only when troubleshooting attach issues.
debug = 0

; Input isolation (1.4.0 — dark launch)
; Blocks character-bound actions (move/combat/jump/interact) while Photo Mode is
; active so stray keypresses cannot disturb the photo camera. Camera-side safety
; for inventory/map/cutscene is handled by the auto-exit watchdog below.
; Note: keep 0/1 here — Dawnwalker Mod Menu requires numeric toggle values.
enable_input_isolation = 1

; Auto-exit watchdog (opt-in)
; If the game steals the camera (inventory, map, journal, cutscene, game menu)
; while Photo Mode is active, perform a clean fully-restored exit instead of
; leaving Photo Mode in a broken state.
; Default: 1 (on). Set 0 to disable.
; Note: keep 0/1 here — Dawnwalker Mod Menu requires numeric toggle values.
auto_exit_on_view_change = 1

; Auto-freeze on Photo Mode entry (1.5.0 — opt-in)
; Automatically freeze world time when entering Photo Mode (default on,
; mimicking built-in photo modes). Set to 0 to keep the world running
; as in v1.4.x.
pause_on_enter = 1

[Camera]
fov_default = 90
fov_min = 10.0
fov_max = 170.0
fov_step = 5.0
vertical_speed = 10
camera_max_distance = 6000.0
camera_speed = 4.0
slomo_step = 0.5
slomo_min = 0.02
slomo_max = 1.0
roll_step = 15.0
roll_max = 90.0
; Arrow-key step for the OSD Exposure row (EV, range -4.0 to +4.0) (1.6.0)
exposure_step = 0.25

[Stage]
; Spawn placement relative to the camera
clone_distance = 150.0
clone_side = 0.0
clone_height = 0.0
clone_yaw = 180.0
; Step sizes when moving/rotating a spawned clone (cm / degrees)
clone_step_fwd = 10.0
clone_step_side = 10.0
clone_step_height = 5.0
clone_step_yaw = 5.0
; Max clones that can be spawned at once (1.6.0). Higher counts cost VRAM/FPS.
; Set 0 for no limit.
max_clones = 5

[Experimental]
; 1.5.0 features in active testing
; Note: keep 0/1 here — Dawnwalker Mod Menu requires numeric toggle values.
enable_experimental = 1
; Photo Mode in cutscenes/dialogues (1.6.0 — opt-in)
; The game refuses Photo Mode while a cinematic or dialogue sequence plays.
; With this on, PM pauses every playing sequence (picture, sound and camera
; cuts stop together) and activates anyway. Sequences resume exactly where
; they stopped when Photo Mode exits. Set 0 to keep the native block.
force_cutscene_pm = 1
