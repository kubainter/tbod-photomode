[Mod]
Id = TBOD_PhotoMode
Name = Photo Mode
Author = Botan
Version = 1.6.1
Description = Settings for the TBOD Photo Mode. Hotkeys still need to be edited in photo_mode.ini.

[Setting.osd_show]
Id = osd_show
Type = toggle
Label = Show OSD on enter
Description = Automatically show the On-Screen Display when activating Photo Mode.
Group = Interface
PresetValues = 0|1
PresetLabels = Hidden|Visible
Default = 1
ConfigFile = Scripts/config/photo_mode.ini
ConfigSection = PhotoMode
ConfigKey = osd_show_on_enter

[Setting.osd_scale]
Id = osd_scale
Type = slider
Label = OSD Scale
Description = Size multiplier for the On-Screen Display. Increase for 1440p/4K monitors.
Group = Interface
Minimum = 0.5
Maximum = 3.0
Step = 0.1
Decimals = 1
Default = 1.5
ConfigFile = Scripts/config/photo_mode.ini
ConfigSection = PhotoMode
ConfigKey = osd_scale

[Setting.fov_default]
Id = fov_default
Type = integer
Label = Default FOV
Description = Default Field of View when entering Photo Mode or pressing reset.
Group = Camera
Minimum = 10
Maximum = 170
Step = 5
Decimals = 0
Default = 90
ConfigFile = Scripts/config/photo_mode.ini
ConfigSection = Camera
ConfigKey = fov_default

[Setting.camera_speed]
Id = camera_speed
Type = slider
Label = Camera Speed
Description = Base flight speed of the camera drone.
Group = Camera
Minimum = 1.0
Maximum = 20.0
Step = 1.0
Decimals = 1
Default = 4.0
ConfigFile = Scripts/config/photo_mode.ini
ConfigSection = Camera
ConfigKey = camera_speed

[Setting.vertical_speed]
Id = vertical_speed
Type = integer
Label = Vertical Speed
Description = Speed of vertical movement (E/Q keys).
Group = Camera
Minimum = 10
Maximum = 500
Step = 10
Decimals = 0
Default = 10
ConfigFile = Scripts/config/photo_mode.ini
ConfigSection = Camera
ConfigKey = vertical_speed

[Setting.input_isolation]
Id = input_isolation
Type = toggle
Label = Input Isolation
Description = Blocks character actions (move/attack/jump/interact) while Photo Mode is active so stray keys do not disturb the shot.
Group = Input
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = Scripts/config/photo_mode.ini
ConfigSection = PhotoMode
ConfigKey = enable_input_isolation

[Setting.auto_exit]
Id = auto_exit
Type = toggle
Label = Auto-Exit Watchdog
Description = If the game opens a menu (inventory, map, journal) or steals the camera while Photo Mode is active, safely exit Photo Mode and restore the character.
Group = Input
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = Scripts/config/photo_mode.ini
ConfigSection = PhotoMode
ConfigKey = auto_exit_on_view_change

[Setting.pause_on_enter]
Id = pause_on_enter
Type = toggle
Label = Freeze World on Enter
Description = Automatically freeze world time when entering Photo Mode, like built-in photo modes in other games. Unfreezes on exit.
Group = Photo Mode
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = Scripts/config/photo_mode.ini
ConfigSection = PhotoMode
ConfigKey = pause_on_enter

[Setting.force_cutscene_pm]
Id = force_cutscene_pm
Type = toggle
Label = Photo Mode in cutscenes
Description = Lets Photo Mode activate during cinematics and dialogues: every playing sequence is paused (picture, sound and camera cuts) and resumed exactly where it stopped on exit.
Group = Photo Mode
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = Scripts/config/photo_mode.ini
ConfigSection = Experimental
ConfigKey = force_cutscene_pm